name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Disk image
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh
      - name: Zip
        run: cd dist && ditto -c -k --keepParent OpenMount.app "OpenMount-${GITHUB_REF_NAME}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenMount-*.dmg
            dist/OpenMount-*.zip
          body_path: .github/release-body.md
          append_body: true
          generate_release_notes: true
